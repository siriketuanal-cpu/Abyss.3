<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深淵</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="styles-primary-v237.min.css?v=22">
<style id="abysss-version-style">.app-version{display:inline-block!important;padding:0!important;border:0!important;background:transparent!important;font:inherit!important;font-size:10px!important;line-height:1!important;color:#fff!important;opacity:.9!important;margin:0!important;cursor:pointer!important;user-select:none!important;-webkit-appearance:none!important;appearance:none!important}.app-version:active{opacity:.7}</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-left"><button class="app-version" id="appVersion" type="button" aria-label="最新版を確認">v2.54</button></div>
    <span class="daily-val" id="dailyDateDisplay">—</span>
    <span class="daily-progress" id="dailyProgress"></span>
  </div>
  <div class="grid" id="grid" aria-label="ドットアビス全グループ"></div>
  <div id="gamesAll" aria-label="Gジェネ・スターリープタイマー" data-secondary-state="idle">
    <div class="game-tab-panel" id="game-panel-g" aria-label="Gジェネ">
      <div class="gsection"><div class="gwrap" id="gwrap"></div></div>
    </div>
    <div class="game-tab-panel" id="game-panel-sl" aria-label="スターリープ">
      <div class="slsection"><div class="slwrap" id="slwrap"></div></div>
    </div>
  </div>
  <div class="backdrop" id="backdrop" onclick="closeAllPanels()"></div>
</div>
<footer><span id="saveStamp">読み込み中…</span></footer>

<script defer src="abysss-timer-model-v1.js?v=3"></script>
<script defer src="abysss-core-v1.js?v=4"></script>
<script defer src="app-primary-v237.min.js?v=32"></script>
<script>(()=>{const VERSION='2.54',el=document.getElementById('appVersion');if(el){el.textContent='v2.54';el.addEventListener('click',async()=>{el.textContent='更新…';try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();if(reg&&reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});await new Promise(resolve=>{let done=!1;const finish=()=>{if(done)return;done=!0;resolve()};navigator.serviceWorker.addEventListener('controllerchange',finish,{once:!0});setTimeout(finish,900)})}else{await new Promise(r=>setTimeout(r,120))}}const u=new URL(location.href);u.searchParams.set('update',Date.now().toString(36));location.replace(u.toString())}catch(_){location.reload()}})}window.__abysssVersion=VERSION})();</script>
</body>
</html>
