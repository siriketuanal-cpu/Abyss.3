<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深淵</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="styles-primary-v237.min.css?v=19">
<style id="abysss-version-style">.app-version{display:inline-block!important;padding:0!important;border:0!important;background:transparent!important;font:inherit!important;font-size:10px!important;line-height:1!important;color:#fff!important;opacity:.9!important;margin:0!important;cursor:pointer!important;user-select:none!important;-webkit-appearance:none!important;appearance:none!important}.app-version:active{opacity:.7}</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-left"><button class="app-version" id="appVersion" type="button" aria-label="最新版を確認">v2.40</button></div>
    <span class="daily-val" id="dailyDateDisplay">—</span>
    <span class="daily-progress" id="dailyProgress"></span>
  </div>
  <div class="grid" id="grid" aria-label="ドットアビス全グループ"></div>
  <div id="gamesAll" aria-label="Gジェネ・スターリープタイマー" data-secondary-state="idle">
    <div class="game-tab-panel" id="game-panel-g" aria-label="Gジェネ">
      <div class="gsection"><div class="gwrap" id="gwrap"></div></div>
    </div>
    <div class="game-tab-panel" id="game-panel-sl" aria-label="スターリープ">
      <div class="slsection"><div class="slwrap" id="slwrap"></div></div>
    </div>
  </div>
  <div class="backdrop" id="backdrop" onclick="closeAllPanels()"></div>
</div>
<footer><span id="saveStamp">読み込み中…</span></footer>
<script>
/* Abyss.3 起動・復帰ウォッチドッグ
   通常時は監視だけ。異常時のみ段階的に復旧する。 */
(()=>{const K="abyss3:boot-recovery",MAX=1;let recovered=false,last=0;
const ok=()=>{const g=document.getElementById("grid");return !!(g&&g.children.length)};
const once=()=>{if(recovered)return;try{if(sessionStorage.getItem(K)==="1")return}catch(_){}
recovered=true;try{sessionStorage.setItem(K,"1")}catch(_){}
setTimeout(()=>location.reload(),80)};
const check=delay=>setTimeout(()=>{if(!ok())once()},delay);
const onResume=()=>{if(document.hidden)return;const now=Date.now();if(now-last<700)return;last=now;
requestAnimationFrame(()=>{if(ok()){try{sessionStorage.removeItem(K)}catch(_){}return}
check(900)})};
document.addEventListener("visibilitychange",onResume,{passive:true});
window.addEventListener("pageshow",onResume,{passive:true});
window.addEventListener("focus",onResume,{passive:true});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>check(4200),{once:true,passive:true});else check(4200);
})();
</script>
<script defer src="abysss-timer-model-v1.js?v=1"></script>
<script defer src="abysss-core-v1.js?v=2"></script>
<script defer src="app-primary-v237.min.js?v=19"></script>
<script>(()=>{const VERSION='2.40',el=document.getElementById('appVersion');if(el){el.textContent='v2.40';el.addEventListener('click',async()=>{el.textContent='更新…';try{const u=new URL(location.href);u.searchParams.set('update',Date.now().toString(36));location.replace(u.toString())}catch(_){location.reload()}})}window.__abysssVersion=VERSION})();</script>
</body>
</html>
